# Throwaway Dovecot for tests/test_integration_imap.py (used by CI; works locally too).
# Accepts any username with the password "testpw" over plain IMAP on 127.0.0.1:10143.
# Start: sudo mkdir -p /run/dvt /run/dvt-mail && sudo chown dovecot:dovecot /run/dvt-mail
#        sudo dovecot -c tests/ci/dovecot.conf
protocols = imap
listen = 127.0.0.1
base_dir = /run/dvt
log_path = /tmp/dovecot-test.log
ssl = no
auth_mechanisms = plain login
disable_plaintext_auth = no
mail_location = maildir:/run/dvt-mail/%u
mail_uid = dovecot
mail_gid = dovecot
first_valid_uid = 100
default_internal_user = dovecot
default_login_user = dovenull
service imap-login {
  inet_listener imap {
    port = 10143
  }
}
passdb {
  driver = static
  args = password=testpw
}
userdb {
  driver = static
  args = uid=dovecot gid=dovecot home=/run/dvt-mail/%u
}
namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox "Sent Messages" {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}
