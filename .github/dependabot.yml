# Keeps the SHA-pinned GitHub Actions and the locked Python dependencies up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
