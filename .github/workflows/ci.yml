name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (a tag can be moved); Dependabot keeps them current.
# Dependencies install from uv.lock with --locked: exact versions, every file hash-checked.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m mypy

  test:
    # Unit tests, plus Calendar/Contacts against a real Radicale server the tests start.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev
      - run: uv run pytest -q

  imap-integration:
    # Mail tools against a real IMAP server (Dovecot).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - name: Start Dovecot
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q dovecot-imapd
          sudo mkdir -p /run/dvt /run/dvt-mail
          sudo chown dovecot:dovecot /run/dvt-mail
          sudo dovecot -c tests/ci/dovecot.conf
      - run: uv sync --locked --extra dev
      - run: uv run pytest -q tests/test_integration_imap.py
        env:
          ICLOUD_TEST_IMAP: "127.0.0.1:10143:testpw"
      - if: failure()
        run: sudo cat /tmp/dovecot-test.log || true
